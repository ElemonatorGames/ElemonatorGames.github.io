<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mine With Friends</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0a0a0a;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        /* Page-level gestures off. Without this the browser owns any second
           touch: with one finger steering the joystick, a second finger tapping a
           HUD button was interpreted as the start of a pinch/double-tap-zoom, and
           the browser withheld the click entirely — so menu icons and the tutorial
           dismiss did nothing while moving. Scrollable menu bodies opt back in
           with `touch-action: pan-y` (see ui/styles.ts). */
        touch-action: none;
      }
      #game {
        display: block;
        width: 100vw;
        /* `dvh` tracks the *visible* viewport, so the canvas keeps filling the
           screen as mobile browser chrome slides in and out; `vh` is the fallback
           for engines without it (and is what desktop resolves to anyway). */
        height: 100vh;
        height: 100dvh;
        /* Stop pinch/scroll/long-press gestures from fighting the game or
           scrolling the parent portal page. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #unsupported {
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        color: #eee;
        font-family: system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }
      /* Loading overlay: visible from first paint (no JS required to show it),
         so there's never a blank frame while the module graph/boot sequence
         runs. `src/ui/loading-screen.ts` takes ownership of these nodes once
         JS boots (progress, tooltips, hide, or the error/retry state) — it
         never re-renders them, just updates them in place. Colors are copied
         literally from `src/ui/theme.ts` (PALETTE/ACCENTS.gold): this file
         can't import TS constants into a pre-module inline block. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #12141c;
        color: #e8ecf5;
        font-family: Nunito, 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, Roboto,
          'Helvetica Neue', 'PingFang SC', 'Hiragino Sans', 'Microsoft YaHei', 'Malgun Gothic', sans-serif;
        transition: opacity 0.3s ease;
      }
      #loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: min(320px, 80vw);
        box-sizing: border-box;
      }
      #loading-title {
        font-size: 22px;
        font-weight: 800;
        color: #ffcb3d;
        letter-spacing: 0.02em;
        text-align: center;
      }
      #loading-track {
        width: 100%;
        height: 10px;
        border-radius: 999px;
        background: #20232e;
        border: 1px solid #4a5066;
        overflow: hidden;
        box-sizing: border-box;
      }
      #loading-bar {
        height: 100%;
        width: 0%;
        background: #ffcb3d;
        transition: width 0.25s ease;
      }
      #loading-pct {
        font-size: 13px;
        font-weight: 700;
        color: #8b93a8;
      }
      #loading-tip {
        min-height: 32px;
        font-size: 13px;
        color: #c6a349;
        text-align: center;
        line-height: 1.4;
      }
      .loading-error-msg {
        font-size: 15px;
        text-align: center;
        color: #e8ecf5;
        max-width: 280px;
      }
      .loading-error-btn {
        font: inherit;
        font-weight: 800;
        font-size: 14px;
        padding: 10px 24px;
        border-radius: 8px;
        border: none;
        background: #ffcb3d;
        color: #3a2600;
        cursor: pointer;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-CnWitxnc.js"></script>
    <script async data-ad-frequency-hint="30s" src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5648189397594376" crossorigin="anonymous"></script>
    <script>window.adsbygoogle = window.adsbygoogle || [];var adBreak = adConfig = function(o) {adsbygoogle.push(o);}</script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="loading">
      <div id="loading-inner">
        <div id="loading-title">Mine With Friends</div>
        <div id="loading-track"><div id="loading-bar"></div></div>
        <div id="loading-pct">0%</div>
        <div id="loading-tip"></div>
      </div>
    </div>
    <div id="unsupported">
      Your browser is too old to run this game. Please update to a recent version
      of Chrome, Safari, Firefox, or Edge.
    </div>
    <!-- Feature-check: the game bundle targets ES2022. Browsers that can't parse
         it (Safari &lt;15.4, older Android WebViews) would otherwise fail to a blank
         screen. This ES5-safe probe compiles (does not run) a snippet of ES2022
         syntax; a SyntaxError means the bundle won't load, so we show a friendly
         message instead. -->
    <script>
      (function () {
        try {
          // class private fields, Array.prototype.at, logical assignment.
          new Function('class C{#x=1;m(){return this.#x}}var a=[1].at(0);var b={};b.x??=2;');
        } catch (e) {
          var msg = document.getElementById('unsupported');
          if (msg) msg.style.display = 'flex';
          var game = document.getElementById('game');
          if (game) game.style.display = 'none';
          // The module bundle can't run on this browser, so the loading
          // overlay would otherwise sit there forever with nothing to hide it.
          var loading = document.getElementById('loading');
          if (loading) loading.style.display = 'none';
        }
      })();
    </script>
  </body>
</html>
